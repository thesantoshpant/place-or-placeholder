# Primary hypothesis family (deviations_from_protocol.md row 12, fixed 2026-11-16).
# Pooled-over-horizons G_excess = WIS(L3+C*) - WIS(L4+C*), history arm, one cell per
# country x split; Holm across the 14 cells (scripts/run/primary_family.py).
# runs: role -> run dir (or a list of dirs, e.g. extra-seed runs). For S1 the cells use the
# shared-params rule (runs/<c>_s1_shared); when `plan` is given, a stage marked
# "reuse:<dir>" in that plan.json replaces the listed dir. A cell is available only when all
# four roles have scores.parquet; otherwise it is reported as pending.
# Spatial splits are named as split_pipeline.sh writes them: runs/<country>_<split>_<stage>
# (S5: country = held-out country).
cells:
  - country: brazil
    split: S1
    arm: history
    plan: runs/brazil_s1_shared/plan.json
    runs:
      L3: runs/brazil_s1_shared_L3
      L4: runs/brazil_s1_shared_L4
      L3C: runs/brazil_s1_shared_L3_Cstar
      L4C: runs/brazil_s1_shared_L4_Cstar
  - country: brazil
    split: S2
    arm: history
