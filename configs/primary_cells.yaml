# Primary hypothesis family (deviations_from_protocol.md rows 12, 21, 22, 24-26; fixed 2026-11-16,
# amended 2026-11-18 after the external review).
# Pooled-over-horizons G_excess = WIS(L3+C*) - WIS(L4+C*), history arm, one cell per
# country x split; Holm across the 14 cells. Every cell below is a member of the family
# (`family: primary`), Taiwan S1 included.
# The v3 results kit (scripts/analysis/make_results.py) is the reference implementation of this
# manifest. scripts/run/primary_family.py reads the same file but knows neither `row_filter`
# nor `add_test_years`, so it reproduces only the pre-review (v2) numbers.
# Keys:
#   row_filter: origin_year  -> primary scored rows = rows whose forecast origin (target week - h)
#       lies in the same epi-year as the target (epi-year = calendar year of the week's
#       Wednesday). Removes the yearly-feature and training-label look-ahead (row 24, review R1).
#       The unfiltered rows are reported as a sensitivity column.
#   primary_horizons: the primary estimate pools h in {1, 4} in EVERY cell (row 21).
#   secondary_pooling: true -> S1 cells also report h1-h4 pooled (secondary_horizons); never
#       in the Holm family. (Old name of this key: `secondary`; it is about horizons only.)
#   add_test_years: extra test-year runs appended to every role once all four are complete
#       (row 25: Taiwan 2021). Until then the cell uses its base runs and is flagged
#       "<year> pending". The base-runs-only set is always reported as a sensitivity cell.
# runs: role -> run dir, or a list of dirs (extra-seed / extra-year runs are concatenated; rows
# are told apart by `seed` and `test_year`). Row 22: Brazil S1 uses seeds 0, 1, 2 at h{1,4}.
# Round 3 (docs/methods/round3_runs.md, decision S1): every cell with seeds 0-2 uses them (mean over
# seeds common to both roles of an estimand): BR S5, CO S1-S4, PE S1, TW S1 (all four roles) and
# PE S5, TW S5 (L3+C*, L4+C* only -> G_excess from seeds 0-2; G_emb and G_id stay seed 0).
# The seed-0-only manifest is configs/primary_cells_v3_seed0.yaml (sensitivity).
# extra_seed_runs (Taiwan only): extra-seed run dirs appended to the PRIMARY cell after
# add_test_years (rk_cells._apply_extra_seed_runs); they are not added to the <id>_no2021
# sensitivity cell, because these runs already contain test year 2021. primary_family.py
# ignores this key and fails on unequal seed sets (PE/TW S5); it is the v2 tool.
# Every estimand uses only the seeds common to both of its roles. For S1 the cells use the
# shared-params rule (runs/<c>_s1_shared); when `plan` is given, a stage marked "reuse:<dir>"
# in that plan.json replaces the FIRST listed dir. A cell is available only when every listed
# dir has scores.parquet; otherwise it is reported as pending.
# Spatial splits are named as split_pipeline.sh writes them: runs/<country>_<split>_<stage>
# (S5: country = held-out country).
row_filter: origin_year
family_size: 14
primary_horizons: [1, 4]
secondary_horizons: [1, 2, 3, 4]
cells:
  - country: brazil
    split: S1
    arm: history
    plan: runs/brazil_s1_shared/plan.json
    family: primary
    secondary_pooling: true
    runs:
      L3: [runs/brazil_s1_shared_L3, runs/brazil_s1_sens_seed1_L3, runs/brazil_s1_sens_seed2_L3]
      L4: [runs/brazil_s1_shared_L4, runs/brazil_s1_sens_seed1_L4, runs/brazil_s1_sens_seed2_L4]
      L3C: [runs/brazil_s1_shared_L3_Cstar, runs/brazil_s1_sens_seed1_L3_Cstar,
            runs/brazil_s1_sens_seed2_L3_Cstar]
      L4C: [runs/brazil_s1_shared_L4_Cstar, runs/brazil_s1_sens_seed1_L4_Cstar,
            runs/brazil_s1_sens_seed2_L4_Cstar]
    note: "seeds 0,1,2 at h1/h4 (row 22); seed 0 only at h2/h3 (secondary pooling)"
  - country: brazil
    split: S2
    arm: history
    plan: runs/brazil_s2/plan.json
    family: primary
    runs:
      L3: runs/brazil_s2_L3
      L4: runs/brazil_s2_L4
      L3C: runs/brazil_s2_L3_Cstar
      L4C: runs/brazil_s2_L4_Cstar
  - country: brazil
